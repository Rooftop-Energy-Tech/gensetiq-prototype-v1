<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The four %BRAND_*% placeholders are filled at build time by the `brandHtml`
         plugin in vite.config.ts, from the active brand's entry in
         src/brands/tab.ts. This file is not JavaScript and cannot read the brand
         registry itself; the plugin is the bridge.

         Left as literal placeholders if you open this file directly rather than
         through Vite — that is the intended failure. A default customer's name
         baked in here is how the previous build ended up with one in every branch. -->
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta name="theme-color" content="#EEEFF2" />
    <link rel="icon" href="%BRAND_FAVICON%" />
    <link rel="apple-touch-icon" href="%BRAND_FAVICON%" />
    <title>%BRAND_TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
